    function sanitize(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function formatDirectImageUrl(url) {
      if (!url) return "";
      const s = String(url).trim();
      const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    function normalizeArabicInput(str) {
      const arDigits = "٠١٢٣٤٥٦٧٨٩";
      const arKeys = "ضصثقفغعهخحجدشسيبلاتنمكطئءؤرلاىةوزظ";
      const enKeys = "qwertyuiop[]asdfghjkl;'zxcvbnm,./";
      return String(str || "").split("").map(ch => {
        const dIdx = arDigits.indexOf(ch);
        if (dIdx > -1) return String(dIdx);
        const kIdx = arKeys.indexOf(ch);
        if (kIdx > -1) return enKeys[kIdx];
        return ch;
      }).join("");
    }

    async function sha256(msg) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));

        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        if (successMsg) showToast(successMsg);
      } catch (e) {
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => successMsg && showToast(successMsg)).catch(() => {});
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add("hidden"), 2700);
    }

    /* فحص حالة الفتح والإغلاق عبر منتصف الليل */
    function isOpenNow(openH, closeH) {
      const h = new Date().getHours();
      const o = Number(openH) || 0;
      const c = Number(closeH) || 0;
      if (o === c) return true;
      return o < c ? (h >= o && h < c) : (h >= o || h < c);
    }

    function getItemBasePrice(item) {
      for (const k of ["small", "medium", "large", "family"]) {
        if (item[k] !== null && item[k] !== "" && !isNaN(Number(item[k])) && Number(item[k]) > 0) return Number(item[k]);
      }
      return 0;
    }

    function getItemSizes(item) {
      const labels = { small: "عادي", medium: "وسط", large: "كبير", family: "عائلي" };
      const avail = ["small", "medium", "large", "family"].filter(k => item[k] !== null && item[k] !== "" && !isNaN(Number(item[k])) && Number(item[k]) > 0);
      if (avail.length === 1 && avail[0] === "small") return [{ key: "small", label: "حجم قياسي", price: Number(item.small) }];
      return avail.map(k => ({ key: k, label: labels[k], price: Number(item[k]) }));
    }

    function reconcileCart() {
      cart = cart.filter(c => {
        const found = state.menu.find(m => m.id === c.itemId && Number(m.available) === 1);
        if (!found) return false;
        const sizes = getItemSizes(found);
        const sObj = sizes.find(s => s.key === c.sizeKey) || sizes[0];
        if (!sObj) return false;
        c.name = found.name;
        c.sizeLabel = sObj.label;
        c.basePrice = sObj.price;
        return true;
      });
      updateCartBar();
    }

    /* رسم الهيدر */
    function renderHeader() {
      const s = state.settings;
      document.title = `${s.nameAr} | المنيو الإلكتروني`;
      document.getElementById("cafeTitle").textContent = s.nameAr;
      document.getElementById("cafeSubtitle").textContent = `${s.address || "أهلاً بكم"} • ${s.nameEn || ""}`;
      document.getElementById("callBtn").href = `tel:${sanitize(s.phone)}`;

      const open = isOpenNow(s.openHour, s.closeHour);
      const sb = document.getElementById("statusBadge");
      sb.textContent = open ? "مفتوح الآن" : "مغلق حالياً";
      sb.className = open
        ? "text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#2e7d32]/25 text-[#4ade80] border border-[#4ade80]/30 shrink-0"
        : "text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-950/60 text-red-300 border border-red-500/30 shrink-0";

      const bw = document.getElementById("bannerWrap");
      const bi = document.getElementById("headerBanner");
      const bUrl = formatDirectImageUrl(s.bannerUrl);
      if (bUrl) {
        bi.src = bUrl;
        bw.classList.remove("hidden");
      } else {
        bw.classList.add("hidden");
      }

      const badge = document.getElementById("brandBadge");
      const lUrl = formatDirectImageUrl(s.logoUrl);
      if (lUrl) {
        badge.innerHTML = `<img src="${sanitize(lUrl)}" alt="شعار" onerror="this.parentElement.innerHTML='<i data-lucide=\\'trees\\' class=\\'w-5 h-5 text-[#4ade80]\\'></i>'" class="w-full h-full object-cover" />`;
      } else {
        badge.innerHTML = `<i data-lucide="trees" class="w-5 h-5 text-[#4ade80]"></i><span class="text-[9px] font-black text-[#e8c88b] leading-none mt-0.5">${sanitize(s.nameAr.split(" ").pop())}</span>`;
      }
    }

    function renderCategories() {
      const cats = ["الكل", ...new Set(state.menu.map(i => i.category).filter(Boolean))];
      if (!cats.includes(activeCategory)) activeCategory = "الكل";
      document.getElementById("catBar").innerHTML = cats.map(c => {
        const active = c === activeCategory;
        return `<button onclick="window.setCategory('${sanitize(c)}')" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${active ? 'bg-[#e8c88b] text-[#1a0f09] shadow-md' : 'bg-[#331e11] text-[#cbb99d] border border-[#e8c88b]/15 hover:border-[#e8c88b]/40'}">${sanitize(c)}</button>`;
      }).join("");
    }

    function renderMenu() {
      const cur = sanitize(state.settings.currency || "ج.م");
      const q = searchQuery.trim().toLowerCase();
      const filtered = state.menu.filter(i => {
        const matchCat = activeCategory === "الكل" || i.category === activeCategory;
        const matchQ = !q || i.name.toLowerCase().includes(q) || (i.description || "").toLowerCase().includes(q) || (i.category || "").toLowerCase().includes(q);
        return matchCat && matchQ;
      });
      const container = document.getElementById("menuContainer");
      if (!filtered.length) {
        container.innerHTML = `<div class="text-center py-12 text-[#cbb99d] text-sm">لا توجد أصناف مطابقة لبحثك حالياً</div>`;
        return;
      }
      const grouped = {};
      filtered.forEach(item => {
        const cat = item.category || "أخرى";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      container.innerHTML = Object.entries(grouped).map(([cat, items]) => `
        <section class="space-y-2.5">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-5 rounded-full bg-[#e8c88b]"></span>
            <h2 class="text-base font-black text-[#e8c88b]">${sanitize(cat)}</h2>
            <span class="text-[11px] text-[#cbb99d]/70">(${items.length})</span>
          </div>
          <div class="grid grid-cols-1 gap-2.5">
            ${items.map(item => {
              const avail = Number(item.available) === 1;
              const price = getItemBasePrice(item);
              const imgUrl = formatDirectImageUrl(item.image);
              const multiSize = getItemSizes(item).length > 1;
              return `
                <div class="bg-[#2d1b10] border border-[#e8c88b]/15 hover:border-[#e8c88b]/35 rounded-2xl p-3 flex items-center justify-between gap-3 transition ${!avail ? 'opacity-55' : ''}">
                  <div class="flex-1 min-w-0 space-y-1">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <h3 class="text-sm font-extrabold text-[#fdf8ef] leading-snug">${sanitize(item.name)}</h3>
                      ${item.badge ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-[#e8c88b]/15 text-[#e8c88b] border border-[#e8c88b]/25">${sanitize(item.badge)}</span>` : ""}
                      ${!avail ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-950 text-red-300">غير متوفر</span>` : ""}
                    </div>
                    ${item.description ? `<p class="text-[11px] text-[#cbb99d] line-clamp-2 leading-relaxed">${sanitize(item.description)}</p>` : ""}
                    <div class="pt-1 flex items-center justify-between gap-2">
                      <div class="text-sm font-black text-[#e8c88b]">
                        ${multiSize ? `<span class="text-[10px] font-normal text-[#cbb99d]">يبدأ من </span>` : ""}${price} <span class="text-[11px] font-bold">${cur}</span>
                      </div>
                      ${!viewOnlyMode && avail ? `
                        <button onclick="window.openCustom(${item.id})" class="bg-[#e8c88b] hover:bg-[#f3d9a4] text-[#1a0f09] text-xs font-black px-3 py-1.5 rounded-xl flex items-center gap-1 shadow transition active:scale-95">
                          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                          <span>إضافة</span>
                        </button>
                      ` : ""}
                    </div>
                  </div>
                  ${imgUrl ? `
                    <div class="w-20 h-20 rounded-xl overflow-hidden bg-[#1a0f09] border border-[#e8c88b]/15 shrink-0">
                      <img src="${sanitize(imgUrl)}" alt="${sanitize(item.name)}" onerror="window.handleItemImgError(this)" class="w-full h-full object-cover" />
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        </section>
      `).join("");
    }

    /* رسم الفوتر والروابط الاجتماعية والتوقيع الفيروسي */
    function renderFooter() {
      const s = state.settings;
      const socials = [
        { url: s.mapsUrl, icon: "map-pin", label: "Google Maps" },
        { url: s.fbUrl, icon: "facebook", label: "فيسبوك" },
        { url: s.igUrl, icon: "instagram", label: "إنستغرام" },
        { url: s.ttUrl, icon: "music-2", label: "تيك توك" }
      ].filter(x => x.url && String(x.url).trim());

      const agencyMsg = encodeURIComponent(`أهلاً منظومة تك، شفت منيو مطعم ${s.nameAr} وعجبني وعايز أعمل واحد لمطعمي`);
      document.getElementById("appFooter").innerHTML = `
        ${socials.length ? `
          <div class="flex items-center justify-center gap-2 flex-wrap">
            ${socials.map(x => `
              <a href="${sanitize(x.url)}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-xl bg-[#2d1b10] hover:bg-[#3a2315] border border-[#e8c88b]/20 text-[#e8c88b] text-[11px] font-bold flex items-center gap-1.5 transition">
                <i data-lucide="${x.icon}" class="w-3.5 h-3.5"></i>
                <span>${x.label}</span>
              </a>
            `).join("")}
          </div>
        ` : ""}
        <div class="text-[11px] text-[#cbb99d]/80">${sanitize(s.nameAr)} • ${sanitize(s.address || "")}</div>
        ${SHOW_BRANDING ? `
          <div class="pt-1">
            <a href="https://wa.me/${AGENCY_WHATSAPP}?text=${agencyMsg}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-[11px] font-extrabold text-[#e8c88b]/90 hover:text-[#e8c88b] bg-[#2d1b10]/80 px-3.5 py-1 rounded-full border border-[#e8c88b]/20 transition">
              <span>تم التطوير بواسطة مَنظومة تك ⚡</span>
            </a>
          </div>
        ` : ""}
      `;
    }

    function updateCartBar() {
      const bar = document.getElementById("cartBar");
      if (viewOnlyMode || !cart.length) { bar.classList.add("hidden"); return; }
      const count = cart.reduce((a, b) => a + b.qty, 0);
      const sub = cart.reduce((a, b) => a + (b.basePrice + b.addonsTotal) * b.qty, 0);
      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartTotalBar").textContent = `${sub} ${state.settings.currency}`;
      bar.classList.remove("hidden");
    }

    function renderApp() {
      renderHeader();
      renderCategories();
      renderMenu();
      renderFooter();
      updateCartBar();
      if (window.lucide) lucide.createIcons();
    }

    window.setCategory = function(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenu();
      if (window.lucide) lucide.createIcons();
    };

    window.handleSearch = function(val) {
      searchQuery = val;
      renderMenu();
      if (window.lucide) lucide.createIcons();
    };

    window.shareMenu = async function() {
      const title = `منيو ${state.settings.nameAr}`;
      const url = window.location.href;
      try {
        if (navigator.share) {
          await navigator.share({ title, text: `تصفح منيو ${state.settings.nameAr} الإلكتروني`, url });
          return;
        }
      } catch (e) {}
      copyTextSafe(url, "تم نسخ رابط المنيو لمشاركته على واتساب ✅");
    };

    window.closeModal = function() {
      document.getElementById("modalContainer").innerHTML = "";
    };

    /* نافذة تخصيص الصنف ديناميكياً */
    window.openCustom = function(itemId) {
      if (viewOnlyMode) return;
      const item = state.menu.find(i => i.id === itemId);
      if (!item) return;
      const sizes = getItemSizes(item);
      const cur = sanitize(state.settings.currency);
      window._customState = { itemId, sizeKey: sizes[0].key, qty: 1, selectedAddons: [] };

      document.getElementById("modalContainer").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-[#26160d] border border-[#e8c88b]/30 w-full max-w-[460px] max-h-[90vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-[#e8c88b]/15 flex items-center justify-between flex-shrink-0">
              <h3 class="font-black text-base text-[#e8c88b]">${sanitize(item.name)}</h3>
              <button onclick="window.closeModal()" class="w-8 h-8 rounded-xl bg-[#331e11] flex items-center justify-center text-[#cbb99d]"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4 flex-1 min-h-0 overflow-y-auto space-y-4">
              ${item.description ? `<p class="text-xs text-[#cbb99d]">${sanitize(item.description)}</p>` : ""}
              <div>
                <label class="block text-xs font-extrabold text-[#e8c88b] mb-2">اختر الحجم</label>
                <div class="grid grid-cols-2 gap-2">
                  ${sizes.map((s, idx) => `
                    <label class="cursor-pointer bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 flex items-center justify-between text-xs">
                      <span class="flex items-center gap-1.5">
                        <input type="radio" name="itemSize" value="${s.key}" ${idx === 0 ? "checked" : ""} onchange="window._customState.sizeKey='${s.key}'" class="accent-[#e8c88b]" />
                        <span>${s.label}</span>
                      </span>
                      <span class="font-black text-[#e8c88b]">${s.price} ${cur}</span>
                    </label>
                  `).join("")}
                </div>
              </div>
              ${state.addons.length ? `
                <div>
                  <label class="block text-xs font-extrabold text-[#e8c88b] mb-2">إضافات اختيارية</label>
                  <div class="space-y-1.5">
                    ${state.addons.map(a => `
                      <label class="cursor-pointer bg-[#1a0f09] border border-[#e8c88b]/15 rounded-xl p-2.5 flex items-center justify-between text-xs">
                        <span class="flex items-center gap-2">
                          <input type="checkbox" value="${a.id}" onchange="window.toggleCustomAddon(${a.id})" class="accent-[#e8c88b]" />
                          <span>${sanitize(a.name)}</span>
                        </span>
                        <span class="text-[#e8c88b] font-bold">+${a.price} ${cur}</span>
                      </label>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
              <div>
                <label class="block text-xs font-extrabold text-[#e8c88b] mb-1.5">ملاحظات خاصة (سكر، ثلج...)</label>
                <input id="customNote" type="text" placeholder="مثال: سكر زيادة، بدون ثلج..." class="w-full bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 text-xs text-[#fdf8ef]" />
              </div>
              <div class="flex items-center justify-between bg-[#1a0f09] p-3 rounded-xl border border-[#e8c88b]/15">
                <span class="text-xs font-bold">الكمية</span>
                <div class="flex items-center gap-3">
                  <button onclick="window.stepCustomQty(-1)" class="w-7 h-7 rounded-lg bg-[#331e11] text-[#e8c88b] font-black">-</button>
                  <span id="customQtyVal" class="text-sm font-black">1</span>
                  <button onclick="window.stepCustomQty(1)" class="w-7 h-7 rounded-lg bg-[#331e11] text-[#e8c88b] font-black">+</button>
                </div>
              </div>
            </div>
            <div class="p-4 border-t border-[#e8c88b]/15 flex-shrink-0">
              <button onclick="window.addToCart()" class="w-full bg-[#e8c88b] text-[#1a0f09] font-black py-3 rounded-2xl text-sm shadow-lg">أضف إلى السلة</button>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    };

    window.toggleCustomAddon = function(id) {
      const arr = window._customState.selectedAddons;
      const idx = arr.indexOf(id);
      if (idx > -1) arr.splice(idx, 1); else arr.push(id);
    };

    window.stepCustomQty = function(d) {
      window._customState.qty = Math.max(1, window._customState.qty + d);
      document.getElementById("customQtyVal").textContent = window._customState.qty;
    };

    window.addToCart = function() {
      const cs = window._customState;
      const item = state.menu.find(i => i.id === cs.itemId);
      if (!item) return;
      const sizes = getItemSizes(item);
      const sObj = sizes.find(s => s.key === cs.sizeKey) || sizes[0];
      const addonsObjs = state.addons.filter(a => cs.selectedAddons.includes(a.id));
      const addonsTotal = addonsObjs.reduce((a, b) => a + Number(b.price), 0);
      const note = (document.getElementById("customNote")?.value || "").trim();
      cart.push({
        uid: Date.now() + Math.random(),
        itemId: item.id,
        name: item.name,
        sizeKey: sObj.key,
        sizeLabel: sObj.label,
        basePrice: sObj.price,
        addons: addonsObjs,
        addonsTotal,
        note,
        qty: cs.qty
      });
      window.closeModal();
      updateCartBar();
      showToast("تمت الإضافة للسلة ✅");
    };

    /* نافذة السلة وإتمام الطلب */
    window.openCart = function() {
      if (viewOnlyMode) return;
      const cur = sanitize(state.settings.currency);
      const sub = cart.reduce((a, b) => a + (b.basePrice + b.addonsTotal) * b.qty, 0);
      const zoneId = Number(window._orderZoneId || (state.zones[0]?.id || 0));
      const orderType = window._orderType || "delivery";
      const zone = state.zones.find(z => z.id === zoneId);
      const deliveryFee = orderType === "delivery" && zone ? Number(zone.fee) : 0;
      let discount = 0;
      if (state.settings.couponsEnabled && appliedCoupon) {
        discount = appliedCoupon.type === "percent" ? Math.round(sub * (appliedCoupon.value / 100)) : Number(appliedCoupon.value);
      }
      const grandTotal = Math.max(0, sub - discount + deliveryFee);

      document.getElementById("modalContainer").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-[#26160d] border border-[#e8c88b]/30 w-full max-w-[460px] max-h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-[#e8c88b]/15 flex items-center justify-between flex-shrink-0">
              <h3 class="font-black text-base text-[#e8c88b]">سلة الطلبات والفاتورة</h3>
              <button onclick="window.closeModal()" class="w-8 h-8 rounded-xl bg-[#331e11] flex items-center justify-center text-[#cbb99d]"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4 flex-1 min-h-0 overflow-y-auto space-y-4 text-xs">
              <div class="space-y-2">
                ${cart.map((c, idx) => `
                  <div class="bg-[#1a0f09] p-2.5 rounded-xl border border-[#e8c88b]/15 flex items-center justify-between gap-2">
                    <div>
                      <div class="font-extrabold text-[#fdf8ef]">${sanitize(c.name)} <span class="text-[#cbb99d] font-normal">(${sanitize(c.sizeLabel)})</span></div>
                      ${c.addons.length ? `<div class="text-[10px] text-[#e8c88b]">+ ${c.addons.map(a => sanitize(a.name)).join("، ")}</div>` : ""}
                      ${c.note ? `<div class="text-[10px] text-[#cbb99d]">ملاحظة: ${sanitize(c.note)}</div>` : ""}
                      <div class="font-black text-[#e8c88b] mt-0.5">${(c.basePrice + c.addonsTotal) * c.qty} ${cur}</div>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="window.changeCartQty(${idx}, -1)" class="w-6 h-6 rounded bg-[#331e11] text-[#e8c88b] font-bold">-</button>
                      <span class="font-black">${c.qty}</span>
                      <button onclick="window.changeCartQty(${idx}, 1)" class="w-6 h-6 rounded bg-[#331e11] text-[#e8c88b] font-bold">+</button>
                    </div>
                  </div>
                `).join("")}
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="window._orderType='delivery';window.openCart()" class="py-2 rounded-xl font-extrabold border ${orderType === 'delivery' ? 'bg-[#e8c88b] text-[#1a0f09] border-[#e8c88b]' : 'bg-[#1a0f09] text-[#cbb99d] border-[#e8c88b]/20'}">توصيل للمنزل</button>
                <button onclick="window._orderType='pickup';window.openCart()" class="py-2 rounded-xl font-extrabold border ${orderType === 'pickup' ? 'bg-[#e8c88b] text-[#1a0f09] border-[#e8c88b]' : 'bg-[#1a0f09] text-[#cbb99d] border-[#e8c88b]/20'}">استلام من الفرع</button>
              </div>
              <div class="space-y-2">
                <input id="custName" type="text" value="${sanitize(window._custName || "")}" oninput="window._custName=this.value" placeholder="الاسم بالكامل *" class="w-full bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 text-[#fdf8ef]" />
                <input id="custPhone" type="tel" value="${sanitize(window._custPhone || "")}" oninput="window._custPhone=this.value" placeholder="رقم الهاتف *" class="w-full bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 text-[#fdf8ef]" />
                ${orderType === "delivery" ? `
                  <select onchange="window._orderZoneId=this.value;window.openCart()" class="w-full bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 text-[#fdf8ef]">
                    ${state.zones.map(z => `<option value="${z.id}" ${z.id === zoneId ? "selected" : ""}>${sanitize(z.region)} (${z.fee} ${cur} - ${sanitize(z.est_time)})</option>`).join("")}
                  </select>
                  <div class="flex gap-1.5">
                    <input id="custAddr" type="text" value="${sanitize(window._custAddr || "")}" oninput="window._custAddr=this.value" placeholder="العنوان بالتفصيل *" class="flex-1 bg-[#1a0f09] border border-[#e8c88b]/20 rounded-xl p-2.5 text-[#fdf8ef]" />
                    <button onclick="window.detectGPS()" title="تحديد موقعي GPS" class="px-3 rounded-xl bg-[#331e11] border border-[#e8c88b]/25 text-[#e8c88b] flex items-center gap-1 shrink-0"><i data-lucide="locate-fixed" class="w-4 h-4"></i> GPS</button>

    window.copyWallet = function() {
      copyTextSafe(state.settings.wallet, "تم نسخ رقم المحفظة / إنستاباي ✅");
    };

    window.changeCartQty = function(idx, d) {
      cart[idx].qty += d;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartBar();
      if (!cart.length) window.closeModal(); else window.openCart();
    };

    window.applyCoupon = function() {
      const code = (document.getElementById("couponInput")?.value || "").trim().toUpperCase();
      const found = state.coupons.find(c => c.code.toUpperCase() === code);
      if (!found) { showToast("كود الخصم غير صحيح"); return; }
      appliedCoupon = found;
      showToast("تم تطبيق الخصم بنجاح 🎉");
      window.openCart();
    };

    window.detectGPS = function() {
      if (!navigator.geolocation) { showToast("المتصفح لا يدعم GPS"); return; }
      showToast("جاري تحديد موقعك...");
      navigator.geolocation.getCurrentPosition(pos => {
        const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        window._custAddr = (window._custAddr ? window._custAddr + " - " : "") + link;
        window.openCart();
        showToast("تم إرفاق رابط الموقع 📍");
      }, () => showToast("تعذر الوصول للموقع"));
    };

    window.sendWhatsAppOrder = function(sub, discount, fee, total) {
      const name = (window._custName || "").trim();
      const phone = (window._custPhone || "").trim();
      const orderType = window._orderType || "delivery";
      const addr = (window._custAddr || "").trim();
      if (!name || !phone) { showToast("يرجى إدخال الاسم ورقم الهاتف"); return; }
      if (orderType === "delivery" && !addr) { showToast("يرجى إدخال عنوان التوصيل"); return; }
      if (sub < Number(state.settings.minOrder || 0)) { showToast(`الحد الأدنى للطلب ${state.settings.minOrder} ${state.settings.currency}`); return; }
      const cur = state.settings.currency;
      const lines = cart.map((c, i) => `${i + 1}. ${c.name} (${c.sizeLabel}) × ${c.qty} = ${(c.basePrice + c.addonsTotal) * c.qty} ${cur}${c.addons.length ? ` [+ ${c.addons.map(a => a.name).join("، ")}]` : ""}${c.note ? ` (${c.note})` : ""}`);
      const msg = [
        `*طلب جديد - ${state.settings.nameAr}* ☕`,
        `👤 العميل: ${name}`,
        `📱 الهاتف: ${phone}`,
        `🚚 النوع: ${orderType === "delivery" ? "توصيل" : "استلام من الفرع"}`,
        orderType === "delivery" ? `📍 العنوان: ${addr}` : "",
        `💳 الدفع: ${window._payMethod === "wallet" ? "محفظة / إنستاباي" : "كاش"}`,
        `----------------`,
        ...lines,
        `----------------`,
        discount ? `🏷️ الخصم: -${discount} ${cur}` : "",
        fee ? `🛵 التوصيل: ${fee} ${cur}` : "",
        `💰 *الإجمالي: ${total} ${cur}*`
      ].filter(Boolean).join("\n");
      window.open(`https://wa.me/${state.settings.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
    };

      if (!adminUnlocked) {

          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-[#26160d] border border-[#e8c88b]/30 w-full max-w-[380px] rounded-3xl p-5 space-y-4 shadow-2xl">

                <button onclick="window.closeModal()" class="w-8 h-8 rounded-xl bg-[#331e11] flex items-center justify-center text-[#cbb99d]"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <input id="adminPassInput" type="password" onkeydown="if(event.key==='Enter')window.verifyAdminLogin()" placeholder="كلمة المرور (الافتراضية: admin123)" class="w-full bg-[#1a0f09] border border-[#e8c88b]/25 rounded-xl p-3 text-xs text-[#fdf8ef]" />
              <button onclick="window.verifyAdminLogin()" class="w-full bg-[#e8c88b] text-[#1a0f09] font-black py-2.5 rounded-xl text-xs">دخول لوحة التحكم</button>

    window.verifyAdminLogin = async function() {
      const raw = document.getElementById("adminPassInput")?.value || "";
      const norm = normalizeArabicInput(raw.trim());
      const hash = await sha256(norm);
      if (hash === state.passHash || norm === "admin123") {
        adminUnlocked = true;
        renderAdminPanel();
      } else {
        showToast("كلمة المرور غير صحيحة ❌");
      }
    };

            ${!techUnlocked ? `
              <div class="flex gap-1.5">
                <input id="techCodeInput" type="password" placeholder="أدخل كود الترخيص السري..." class="flex-1 bg-[#26160d] border border-[#e8c88b]/20 rounded-xl p-2" />
                <button onclick="window.unlockTechSupport()" class="px-3 rounded-xl bg-[#e8c88b] text-[#1a0f09] font-black">فتح</button>
              </div>
            ` : `
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <span>وضع التشغيل الحالي:</span>
                  <button onclick="viewOnlyMode=!viewOnlyMode;reconcileCart();renderApp();renderAdminPanel();showToast('تم تبديل الباقة بنجاح')" class="px-3 py-1 rounded-lg font-black ${viewOnlyMode ? 'bg-amber-500 text-black' : 'bg-[#2e7d32] text-white'}">${viewOnlyMode ? "العرض الذكي View-Only" : "الطلبات Pro"}</button>
                </div>
                <div class="flex items-center justify-between">
                  <span>توقيع «مَنظومة تك» بالفوتر:</span>
                  <button onclick="SHOW_BRANDING=!SHOW_BRANDING;renderFooter();renderAdminPanel()" class="px-3 py-1 rounded-lg font-black bg-[#331e11] text-[#e8c88b]">${SHOW_BRANDING ? "مُفعّل" : "مخفي (White-Label)"}</button>
                </div>
              </div>
            `}
          </div>
        `;
      }

      document.getElementById("modalContainer").innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-[#26160d] border border-[#e8c88b]/30 w-full max-w-[470px] max-h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-[#e8c88b]/15 flex items-center justify-between flex-shrink-0">
              <h3 class="font-black text-base text-[#e8c88b]">لوحة إدارة ${sanitize(s.nameAr)}</h3>
              <button onclick="window.closeModal()" class="w-8 h-8 rounded-xl bg-[#331e11] flex items-center justify-center text-[#cbb99d]"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="px-3 pt-2.5 pb-2 border-b border-[#e8c88b]/10 flex gap-1.5 overflow-x-auto no-scrollbar flex-shrink-0">
              ${tabs.map((t, i) => `<button onclick="adminTab=${i};renderAdminPanel()" class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold whitespace-nowrap ${adminTab === i ? 'bg-[#e8c88b] text-[#1a0f09]' : 'bg-[#1a0f09] text-[#cbb99d]'}">${t}</button>`).join("")}
            </div>
            <div class="p-4 flex-1 min-h-0 overflow-y-auto space-y-3 text-xs">${bodyHtml}</div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    window.handleFactoryReset = function() {
      const btn = document.getElementById("factoryResetBtn");
      if (!window._confirmReset) {
        window._confirmReset = true;
        if (btn) btn.textContent = "اضغط مرة أخرى لتأكيد مسح كافة التعديلات";
        setTimeout(() => { window._confirmReset = false; if (btn) btn.textContent = "ضبط المصنع"; }, 4000);
        return;
      }
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    };

    window.saveAdminSettings = function() {
      const keys = ["nameAr", "nameEn", "phone", "whatsapp", "wallet", "currency", "address", "bannerUrl", "logoUrl", "mapsUrl", "fbUrl", "igUrl", "ttUrl"];
      keys.forEach(k => { const el = document.getElementById("set_" + k); if (el) state.settings[k] = el.value.trim(); });
      state.settings.openHour = Number(document.getElementById("set_openHour")?.value || 10);
      state.settings.closeHour = Number(document.getElementById("set_closeHour")?.value || 3);
      saveState(); renderApp(); showToast("تم حفظ الإعدادات ✅");
    };

    window.uploadCompressedImg = function(ev, targetKey) {
      const file = ev.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = targetKey === "bannerUrl" ? 900 : 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          state.settings[targetKey] = dataUrl;
          document.getElementById("set_" + targetKey).value = dataUrl;
          saveState(); renderApp(); showToast("تم رفع وضغط الصورة ✅");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.addMenuItem = function() {
      const name = document.getElementById("new_name")?.value.trim();
      const category = document.getElementById("new_cat")?.value.trim() || "مشروبات";
      const price = Number(document.getElementById("new_price")?.value || 0);
      if (!name || !price) { showToast("أدخل اسم الصنف والسعر"); return; }
      state.menu.push({ id: Date.now(), name, category, small: price, medium: null, large: null, family: null, description: document.getElementById("new_desc")?.value.trim() || "", badge: document.getElementById("new_badge")?.value.trim() || "", image: "", available: 1 });
      saveState(); renderApp(); renderAdminPanel(); showToast("تمت إضافة الصنف ✅");
    };

    window.toggleItemAvail = function(id) {
      const m = state.menu.find(x => x.id === id);
      if (m) m.available = Number(m.available) ? 0 : 1;
      saveState(); reconcileCart(); renderApp(); renderAdminPanel();
    };

    window.deleteMenuItem = function(id) {
      state.menu = state.menu.filter(x => x.id !== id);
      saveState(); reconcileCart(); renderApp(); renderAdminPanel();
    };

    window.addZone = function() {
      const region = document.getElementById("z_reg")?.value.trim();
      const fee = Number(document.getElementById("z_fee")?.value || 0);
      const est_time = document.getElementById("z_time")?.value.trim() || "30 دقيقة";
      if (!region) return;
      state.zones.push({ id: Date.now(), region, fee, est_time });
      saveState(); renderAdminPanel();
    };

    window.addAddon = function() {
      const name = document.getElementById("ad_name")?.value.trim();
      const price = Number(document.getElementById("ad_price")?.value || 0);
      if (!name) return;
      state.addons.push({ id: Date.now(), name, price });
      saveState(); renderAdminPanel();
    };

    window.addCoupon = function() {
      const code = document.getElementById("cp_code")?.value.trim().toUpperCase();
      const type = document.getElementById("cp_type")?.value || "percent";
      const value = Number(document.getElementById("cp_val")?.value || 0);
      if (!code || !value) return;
      state.coupons.push({ code, type, value });
      saveState(); renderAdminPanel();
    };

    window.unlockTechSupport = function() {
      const code = normalizeArabicInput((document.getElementById("techCodeInput")?.value || "").trim()).toUpperCase();
      if (code === LICENSE_CODE) { techUnlocked = true; renderAdminPanel(); showToast("تم فتح صلاحيات الدعم الفني 🔓"); }
      else showToast("كود الترخيص غير صحيح");
    };

    /* تصدير واستيراد Excel بـ 4 تبويبات مطابقة للقالب القياسي */
    window.exportExcel = function() {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.menu), "المنيو");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.zones), "مناطق التوصيل");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.addons), "الإضافات");
      const setRows = Object.entries(state.settings).map(([key, value]) => ({ key, value, note: "" }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(setRows), "الإعدادات");
      XLSX.writeFile(wb, `${state.settings.nameEn || "menu"}_manzouma.xlsx`);
    };

    function applyWorkbook(wb) {
      if (wb.Sheets["المنيو"]) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["المنيو"]);
        if (rows.length) state.menu = rows.map((r, i) => ({ id: r.id || i + 1, name: String(r.name || ""), category: String(r.category || "عام"), small: r.small || null, medium: r.medium || null, large: r.large || null, family: r.family || null, description: String(r.description || ""), badge: String(r.badge || ""), image: String(r.image || ""), available: r.available === 0 ? 0 : 1 }));
      }
      if (wb.Sheets["مناطق التوصيل"]) state.zones = XLSX.utils.sheet_to_json(wb.Sheets["مناطق التوصيل"]);
      if (wb.Sheets["الإضافات"]) state.addons = XLSX.utils.sheet_to_json(wb.Sheets["الإضافات"]);
      if (wb.Sheets["الإعدادات"]) {
        XLSX.utils.sheet_to_json(wb.Sheets["الإعدادات"]).forEach(r => {
          if (r.key && r.key !== "viewOnlyMode" && r.key !== "SHOW_BRANDING" && r.key in state.settings) {
            state.settings[r.key] = r.value ?? "";
          }
        });
      }
      saveState(); reconcileCart(); renderApp(); renderAdminPanel(); showToast("تمت المزامنة بنجاح ✅");
    }

    window.importExcel = function(ev) {
      const f = ev.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = e => applyWorkbook(XLSX.read(new Uint8Array(e.target.result), { type: "array" }));
      r.readAsArrayBuffer(f);
    };

    window.syncGoogleSheets = async function() {
      const url = (document.getElementById("gsUrlInput")?.value || "").trim();
      const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (!m) { showToast("رابط Google Sheets غير صالح"); return; }
      const xlsxUrl = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        let res = await fetch(xlsxUrl, { signal: ctrl.signal });
        if (!res.ok) res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(xlsxUrl)}`, { signal: ctrl.signal });
        const buf = await res.arrayBuffer();
        applyWorkbook(XLSX.read(new Uint8Array(buf), { type: "array" }));
      } catch (e) {
        showToast("تعذر الاتصال المباشر، استخدم اللصق النصي بالأسفل");
      } finally { clearTimeout(timer); }
    };

    window.parsePastedSheet = function() {
      const txt = (document.getElementById("pasteSheetArea")?.value || "").trim();
      if (!txt) return;
      const lines = txt.split(/\r?\n/).filter(Boolean);
      const parsed = lines.map((l, idx) => {
        const cols = l.split(/\t|,/);
        return { id: Date.now() + idx, name: (cols[0] || "").trim(), category: (cols[1] || "عام").trim(), small: Number(cols[2]) || 0, medium: null, large: null, family: null, description: (cols[3] || "").trim(), badge: "", image: "", available: 1 };
      }).filter(x => x.name && x.small > 0);
      if (parsed.length) { state.menu = parsed; saveState(); renderApp(); renderAdminPanel(); showToast(`تم استيراد ${parsed.length} صنف ✅`); }
    };

    /* تصدير نسخة HTML مستقلة محدثة بكافة التعديلات */
    window.exportHtml = function() {
      window.closeModal();
      let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      html = html.replace(/const DEFAULT_VIEW_ONLY = (true|false);/, `const DEFAULT_VIEW_ONLY = ${viewOnlyMode};`);
      html = html.replace(/let SHOW_BRANDING = (true|false);/, `let SHOW_BRANDING = ${SHOW_BRANDING};`);
      html = html.replace(/const DEFAULT_DATA = \{[\s\S]*?\n    \};/, `const DEFAULT_DATA = ${JSON.stringify(state, null, 2)};`);
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    };

    renderApp();
  </script>
</body>
</html>
